<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mi Perfil — Jurado Evaluador')}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content" style="max-width: 600px;">
    <nav th:replace="~{fragments/breadcrumbs :: breadcrumbs('/evaluador/index', 'Panel Jurado', 'Mi Perfil')}"></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Mi Perfil</h1>
            <p class="page-subtitle">Información del miembro del comité académico evaluador</p>
        </div>
        <div>
            <a th:href="@{/evaluador/index}" class="btn btn-outline btn-sm">&larr; Panel</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-card">
        <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);">
            <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; font-weight: 700;">
                <span th:text="${user != null and user.nombre != null ? #strings.substring(user.nombre, 0, 1) : 'J'}">J</span>
            </div>
            <div>
                <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--gray-900);" th:text="${user.nombre + ' ' + user.apellido}">Nombre Jurado</h2>
                <span class="badge badge-warning">EVALUADOR</span>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem; font-size: 0.92rem;">
            <div style="padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
                <span style="color: var(--gray-500);">Nombre</span>
                <strong style="color: var(--gray-900);" th:text="${user.nombre}"></strong>
            </div>
            <div style="padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
                <span style="color: var(--gray-500);">Apellido</span>
                <strong style="color: var(--gray-900);" th:text="${user.apellido}"></strong>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--gray-500);">Correo electrónico</span>
                <strong style="color: var(--gray-900);" th:text="${user.email}"></strong>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
