<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Componente Reutilizable: Tarjeta de Material Educativo
  Parámetros:
  - material: Entidad Material
  - actionUrl: Enlace al detalle o acción
  - actionText: Texto del botón (ej: "Ver Detalles", "Evaluar")
-->
<article th:fragment="card(material, actionUrl, actionText)" class="material-card">
    <div class="material-preview-wrapper">
        <div th:if="${material.ganador}" style="position: absolute; top: 10px; right: 10px; z-index: 10;">
            <span class="badge badge-gold">Ganador</span>
        </div>
        <img th:src="@{'/materiales-participantes/' + ${material.id} + '/preview'}" 
             th:alt="'Portada de ' + ${material.titulo}" 
             class="material-preview-img"
             loading="lazy"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center; background: var(--gray-100); color: var(--gray-500); font-size: 0.8rem;">
            Vista previa no disponible
        </div>
    </div>

    <div class="material-body">
        <div class="badge-group">
            <span class="badge badge-primary" th:text="${material.tipoMaterial}">Tipo</span>
            <span class="badge badge-default" th:text="${material.disciplina}">Disciplina</span>
        </div>

        <h2 class="material-title" th:text="${material.titulo}">Título del material</h2>
        <p class="material-desc" th:text="${material.descripcion}">Descripción del material presentado.</p>

        <div class="material-footer">
            <span class="likes-counter" title="Votos del público">
                <svg style="width: 15px; height: 15px; fill: currentColor;" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span th:text="${material.likes}">0</span>
            </span>

            <a th:if="${actionUrl != null}" th:href="@{${actionUrl}}" class="btn btn-outline btn-sm" th:text="${actionText != null ? actionText : 'Ver Detalles'}">
                Ver Detalles
            </a>
        </div>
    </div>
</article>

</body>
</html>
