<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Materiales Participantes — ' + ${edicion})}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">
    <nav th:replace="~{fragments/breadcrumbs :: breadcrumbs('/', 'Inicio', 'Materiales Participantes')}"></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Materiales Participantes</h1>
            <p class="page-subtitle" th:text="'Convocatoria y galería de materiales educativos &bull; ' + ${edicion}"></p>
        </div>
        <div>
            <a th:href="@{/}" class="btn btn-outline btn-sm">&larr; Volver al inicio</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${materialesParticipantes != null and materialesParticipantes.size() > 0}" class="materials-grid">
        <th:block th:each="material : ${materialesParticipantes}">
            <article th:replace="~{fragments/material-card :: card(${material}, '/materiales-participantes/' + ${#strings.replace(edicion, ' ', '-')} + '/' + ${material.id}, 'Ver Detalles')}"></article>
        </th:block>
    </div>

    <th:block th:if="${materialesParticipantes == null or #lists.isEmpty(materialesParticipantes)}">
        <div th:replace="~{fragments/empty-state :: emptyState('No hay materiales registrados', 'Actualmente no se registran materiales aprobados o postulados para la edición seleccionada.', '/', 'Volver al inicio')}"></div>
    </th:block>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
