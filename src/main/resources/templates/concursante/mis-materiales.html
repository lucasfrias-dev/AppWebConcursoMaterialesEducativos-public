<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis Materiales Postulados — Concursante')}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">
    <nav th:replace="~{fragments/breadcrumbs :: breadcrumbs('/concursante/index', 'Panel Concursante', 'Mis Materiales')}"></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Mis Materiales Postulados</h1>
            <p class="page-subtitle">Historial de propuestas educativas presentadas y estado de dictamen</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <a th:href="@{/concursante/index}" class="btn btn-outline btn-sm">&larr; Panel</a>
            <a th:href="@{/concursante/postular-material}" class="btn btn-primary btn-sm">+ Postular Material</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${materiales != null and materiales.size() > 0}" class="materials-grid">
        <div th:each="material : ${materiales}" class="material-card">
            <div class="material-preview-wrapper">
                <div style="position: absolute; top: 10px; right: 10px; z-index: 10;">
                    <span th:if="${material.aprobado == null}" class="badge badge-warning">En Revisión</span>
                    <span th:if="${material.aprobado == true}" class="badge badge-success">Aprobado</span>
                    <span th:if="${material.aprobado == false}" class="badge badge-danger">Rechazado</span>
                </div>
                <img th:src="@{'/materiales-participantes/' + ${material.id} + '/preview'}" 
                     th:alt="'Portada de ' + ${material.titulo}" 
                     class="material-preview-img"
                     loading="lazy"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center; background: var(--gray-100); color: var(--gray-500); font-size: 0.8rem;">
                    Vista previa no disponible
                </div>
            </div>

            <div class="material-body">
                <div class="badge-group">
                    <span class="badge badge-primary" th:text="${material.tipoMaterial}">Tipo</span>
                    <span class="badge badge-default" th:text="${material.disciplina}">Disciplina</span>
                </div>

                <h2 class="material-title" th:text="${material.titulo}">Título del material</h2>
                <p class="material-desc" th:text="${material.descripcion}">Descripción del material postulado.</p>

                <div style="font-size: 0.8rem; color: var(--gray-500); margin-bottom: 0.85rem;">
                    <div>Edición: <strong th:text="${material.concurso != null ? material.concurso.edicion : 'Sin asignar'}"></strong></div>
                    <div>Evaluación: <span th:text="${material.evaluado ? 'Dictamen emitido' : 'En proceso'}"></span></div>
                </div>

                <div class="material-footer">
                    <span class="likes-counter" title="Votos del público">
                        <svg style="width: 15px; height: 15px; fill: currentColor;" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <span th:text="${material.likes}">0</span>
                    </span>

                    <a th:if="${material.concurso != null}" 
                       th:href="@{'/materiales-participantes/' + ${#strings.replace(material.concurso.edicion, ' ', '-')} + '/' + ${material.id}}" 
                       class="btn btn-outline btn-sm">
                        Ver Ficha
                    </a>
                </div>
            </div>
        </div>
    </div>

    <th:block th:if="${materiales == null or #lists.isEmpty(materiales)}">
        <div th:replace="~{fragments/empty-state :: emptyState('Aún no has postulado materiales', 'Puedes presentar recursos educativos digitales completando el formulario de postulación.', '/concursante/postular-material', 'Postular Mi Primer Material')}"></div>
    </th:block>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
