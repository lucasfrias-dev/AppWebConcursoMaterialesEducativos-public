<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pendientes de Aprobación — Administración')}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content">
    <nav th:replace="~{fragments/breadcrumbs :: breadcrumbs('/administrador/index', 'Administración', 'Pendientes de Aprobación')}"></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Materiales Pendientes de Aprobación</h1>
            <p class="page-subtitle">Revisión de postulaciones recibidas para admisión o rechazo en el certamen</p>
        </div>
        <div>
            <a th:href="@{/administrador/index}" class="btn btn-outline btn-sm">&larr; Panel</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${materiales != null and materiales.size() > 0}" class="materials-grid">
        <div th:each="material : ${materiales}" class="material-card">
            <div class="material-preview-wrapper">
                <div style="position: absolute; top: 10px; right: 10px; z-index: 10;">
                    <span class="badge badge-warning">Requiere Revisión</span>
                </div>
                <img th:src="@{'/materiales-participantes/' + ${material.id} + '/preview'}" 
                     th:alt="'Portada de ' + ${material.titulo}" 
                     class="material-preview-img"
                     loading="lazy"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center; background: var(--gray-100); color: var(--gray-500); font-size: 0.8rem;">
                    Vista previa no disponible
                </div>
            </div>

            <div class="material-body">
                <div class="badge-group">
                    <span class="badge badge-primary" th:text="${material.tipoMaterial}">Tipo</span>
                    <span class="badge badge-default" th:text="${material.disciplina}">Disciplina</span>
                </div>

                <h2 class="material-title" th:text="${material.titulo}">Título del material</h2>
                <p class="material-desc" th:text="${material.descripcion}">Descripción del material postulado.</p>

                <div style="font-size: 0.8rem; color: var(--gray-600); margin-bottom: 1rem;">
                    <div>Autores: <span style="color: var(--gray-800); font-weight: 500;" th:text="${material.autores}"></span></div>
                    <div th:if="${material.concursante != null}">
                        Docente: <span th:text="${material.concursante}"></span>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.85rem;">
                    <a th:href="@{'/view/' + ${material.id}}" target="_blank" class="btn btn-outline btn-sm" style="flex: 1;">
                        Ver PDF
                    </a>
                    <a th:href="${material.urlVideoPresentacion}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="flex: 1;">
                        Ver Video
                    </a>
                </div>

                <div class="material-footer" style="gap: 0.5rem;">
                    <form th:action="@{'/administrador/materiales/' + ${material.id} + '/aprobar'}" method="post" style="flex: 1; margin: 0;">
                        <button type="submit" class="btn btn-success btn-sm" style="width: 100%;" onclick="return confirm('¿Aprobar este material para participar del concurso?');">
                            Aprobar
                        </button>
                    </form>
                    <form th:action="@{'/administrador/materiales/' + ${material.id} + '/rechazar'}" method="post" style="flex: 1; margin: 0;">
                        <button type="submit" class="btn btn-danger btn-sm" style="width: 100%;" onclick="return confirm('¿Rechazar este material?');">
                            Rechazar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block th:if="${materiales == null or #lists.isEmpty(materiales)}">
        <div th:replace="~{fragments/empty-state :: emptyState('No hay materiales pendientes', 'Todas las postulaciones recibidas han sido dictaminadas.', '/administrador/index', 'Volver al Panel')}"></div>
    </th:block>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
