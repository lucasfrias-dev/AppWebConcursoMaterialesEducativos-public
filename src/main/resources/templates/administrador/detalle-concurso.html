<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cronograma Oficial — ' + ${concurso.edicion})}"></head>
<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="main-content" style="max-width: 820px;">
    <nav th:replace="~{fragments/breadcrumbs :: breadcrumbs('/administrador/index', 'Administración', 'Cronograma ' + ${concurso.edicion})}"></nav>

    <div class="page-header">
        <div>
            <h1 class="page-title">Cronograma de Convocatoria</h1>
            <p class="page-subtitle" th:text="'Hitos y fechas oficiales de la ' + ${concurso.edicion}"></p>
        </div>
        <div>
            <a th:href="@{/administrador/index}" class="btn btn-outline btn-sm">&larr; Panel</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-card" style="padding: 1.5rem;">
        <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            <!-- Fecha de inicio -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background-color: var(--gray-50); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <div>
                    <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); font-weight: 600;">Apertura de Convocatoria</span>
                    <div style="font-size: 1.05rem; font-weight: 600; color: var(--gray-900); margin-top: 0.2rem;" 
                         th:text="${#temporals.format(concurso.fechaInicio, 'dd/MM/yyyy HH:mm')} + ' hs'">
                    </div>
                </div>
                <a th:href="@{'/administrador/concurso/' + ${#strings.replace(concurso.edicion, ' ', '-')} + '/editar/fechaInicio'}" class="btn btn-outline btn-sm">
                    Modificar
                </a>
            </div>

            <!-- Fin de postulaciones -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background-color: var(--gray-50); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <div>
                    <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); font-weight: 600;">Cierre de Recepción de Materiales</span>
                    <div style="font-size: 1.05rem; font-weight: 600; color: var(--gray-900); margin-top: 0.2rem;" 
                         th:text="${#temporals.format(concurso.fechaFinPostulaciones, 'dd/MM/yyyy HH:mm')} + ' hs'">
                    </div>
                </div>
                <a th:href="@{'/administrador/concurso/' + ${#strings.replace(concurso.edicion, ' ', '-')} + '/editar/fechaFinPostulaciones'}" class="btn btn-outline btn-sm">
                    Modificar
                </a>
            </div>

            <!-- Inicio de votación -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background-color: var(--gray-50); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <div>
                    <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); font-weight: 600;">Apertura de Votación Abierta</span>
                    <div style="font-size: 1.05rem; font-weight: 600; color: var(--gray-900); margin-top: 0.2rem;" 
                         th:text="${#temporals.format(concurso.fechaInicioVotacion, 'dd/MM/yyyy HH:mm')} + ' hs'">
                    </div>
                </div>
                <a th:href="@{'/administrador/concurso/' + ${#strings.replace(concurso.edicion, ' ', '-')} + '/editar/fechaInicioVotacion'}" class="btn btn-outline btn-sm">
                    Modificar
                </a>
            </div>

            <!-- Fin de votación -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background-color: var(--gray-50); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <div>
                    <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); font-weight: 600;">Cierre de Votación Abierta</span>
                    <div style="font-size: 1.05rem; font-weight: 600; color: var(--gray-900); margin-top: 0.2rem;" 
                         th:text="${#temporals.format(concurso.fechaFinVotacion, 'dd/MM/yyyy HH:mm')} + ' hs'">
                    </div>
                </div>
                <a th:href="@{'/administrador/concurso/' + ${#strings.replace(concurso.edicion, ' ', '-')} + '/editar/fechaFinVotacion'}" class="btn btn-outline btn-sm">
                    Modificar
                </a>
            </div>

            <!-- Fin de concurso -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.15rem; background-color: var(--gray-50); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                <div>
                    <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-500); font-weight: 600;">Clausura Final de la Convocatoria</span>
                    <div style="font-size: 1.05rem; font-weight: 600; color: var(--gray-900); margin-top: 0.2rem;" 
                         th:text="${#temporals.format(concurso.fechaFin, 'dd/MM/yyyy HH:mm')} + ' hs'">
                    </div>
                </div>
                <a th:href="@{'/administrador/concurso/' + ${#strings.replace(concurso.edicion, ' ', '-')} + '/editar/fechaFin'}" class="btn btn-outline btn-sm">
                    Modificar
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
